<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولد QR Code</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f3f4f8; color: #1d1f27; display: flex; justify-content: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 440px; background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 16px; font-size: 22px; text-align: center; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1; padding: 10px; border: 0; border-radius: 10px; background: #eceef4;
    font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .tab.active { background: #3b5bdb; color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  input[type=text], input[type=file] {
    width: 100%; padding: 12px; border: 1px solid #cfd3de; border-radius: 10px; font-size: 15px;
    font-family: inherit; background: #fff;
  }
  button.main {
    width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px;
    background: #3b5bdb; color: #fff; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  button.main:disabled { opacity: .6; cursor: default; }
  button.secondary { background: #2f9e44; }
  #preview { display: none; max-width: 100%; max-height: 180px; margin: 12px auto 0; border-radius: 10px; }
  #status { margin-top: 12px; min-height: 20px; text-align: center; font-size: 14px; color: #555; }
  #status.error { color: #c92a2a; }
  #result { display: none; text-align: center; margin-top: 16px; }
  #qrcode { display: inline-block; padding: 12px; background: #fff; border: 1px solid #e3e6ee; border-radius: 12px; }
  #link { display: block; margin-top: 10px; font-size: 13px; word-break: break-all; color: #3b5bdb; }
</style>
</head>
<body>
<div class="card">
  <h1>مولد QR Code</h1>

  <div class="tabs">
    <button class="tab active" data-tab="image-panel">من صورة</button>
    <button class="tab" data-tab="text-panel">من نص أو رابط</button>
  </div>

  <div id="image-panel" class="panel active">
    <input type="file" id="image-input" accept="image/*">
    <img id="preview" alt="معاينة الصورة">
    <button class="main" id="image-btn">رفع الصورة وإنشاء QR</button>
  </div>

  <div id="text-panel" class="panel">
    <input type="text" id="text-input" placeholder="اكتب نص أو رابط">
    <button class="main" id="text-btn">إنشاء QR</button>
  </div>

  <div id="status"></div>

  <div id="result">
    <div id="qrcode"></div>
    <a id="link" target="_blank" rel="noopener"></a>
    <button class="main secondary" id="download-btn">تحميل صورة QR</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // مفتاح imgbb. لو غيرته من موقعهم حط الجديد هنا.
  const IMGBB_KEY = 'dd38c6bd7f7c9fd626e1e874c02db6be';
  const MAX_SIZE_MB = 16;

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const resultEl = $('result');
  const qrBox = $('qrcode');

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }

  // التبديل بين التابات
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      $(btn.dataset.tab).classList.add('active');
      setStatus('');
    });
  });

  function showQR(text) {
    qrBox.innerHTML = '';
    new QRCode(qrBox, {
      text: text,
      width: 240,
      height: 240,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
    const link = $('link');
    if (/^https?:\/\//i.test(text)) {
      link.textContent = text;
      link.href = text;
      link.style.display = 'block';
    } else {
      link.style.display = 'none';
    }
    resultEl.style.display = 'block';
  }

  // معاينة الصورة
  $('image-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = $('preview');
    if (!file) { preview.style.display = 'none'; return; }
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    setStatus('');
  });

  // رفع الصورة وإنشاء QR
  $('image-btn').addEventListener('click', async () => {
    const file = $('image-input').files[0];
    if (!file) { setStatus('اختار صورة الأول', true); return; }
    if (!file.type.startsWith('image/')) { setStatus('الملف لازم يكون صورة', true); return; }
    if (file.size > MAX_SIZE_MB * 1024 * 1024) { setStatus('الصورة أكبر من ' + MAX_SIZE_MB + ' ميجا', true); return; }

    const btn = $('image-btn');
    btn.disabled = true;
    resultEl.style.display = 'none';
    setStatus('جاري رفع الصورة...');

    try {
      const form = new FormData();
      form.append('image', file);
      const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, {
        method: 'POST',
        body: form
      });
      const json = await res.json();
      if (!res.ok || !json.success) {
        throw new Error((json.error && json.error.message) || 'فشل الرفع');
      }
      const url = json.data.url; // رابط مباشر للصورة بدون إعلانات
      showQR(url);
      setStatus('تم! أي حد يعمل سكان هيشوف الصورة.');
    } catch (err) {
      console.error(err);
      setStatus('حصل خطأ في الرفع: ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  // QR من نص
  $('text-btn').addEventListener('click', () => {
    const text = $('text-input').value.trim();
    if (!text) { setStatus('اكتب نص أو رابط الأول', true); resultEl.style.display = 'none'; return; }
    setStatus('');
    showQR(text);
  });

  // تحميل صورة الـ QR
  $('download-btn').addEventListener('click', () => {
    const canvas = qrBox.querySelector('canvas');
    const img = qrBox.querySelector('img');
    let dataUrl = null;
    if (img && img.src && img.src.startsWith('data:')) dataUrl = img.src;
    else if (canvas) dataUrl = canvas.toDataURL('image/png');
    if (!dataUrl) { setStatus('مفيش QR للتحميل', true); return; }

    const a = document.createElement('a');
    a.download = 'qrcode.png';
    a.href = dataUrl;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
</script>
</body>
</html>
